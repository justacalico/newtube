stages:
  - sync
  - release
  - deploy

variables:
  GLAB_ENABLE_CI_AUTOLOGIN: "true"
  GLAB_VERSION: "1.113.0"
  GIT_DEPTH: "0"
  GIT_STRATEGY: "fetch"
  FLUTTER_IMAGE: "debian:trixie-slim"

.github-common: &github-common
  tags: [linux-truenas]
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client

github-sync:
  tags: [linux-truenas]
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache bash git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - git remote add github git@github.com:justacalico/newtube.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        LOCAL_SHA=$(git rev-parse "$CI_COMMIT_TAG")
        REMOTE_SHA=$(git ls-remote --tags github "refs/tags/$CI_COMMIT_TAG" | awk '{print $1}' | head -n1)
        SINCE=""
        if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
          echo "Tag $CI_COMMIT_TAG already mirrored to GitHub at $REMOTE_SHA, skipping"
        else
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git push -f github "$CI_COMMIT_TAG"
        fi
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
          SHA=$(git rev-parse "$CI_COMMIT_TAG^{commit}")
          RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push ${SINCE:+--since "$SINCE"} || true)
          if [ -z "$RUN_ID" ]; then
            echo "No GitHub run found for tag $CI_COMMIT_TAG" >&2
            exit 1
          fi
          bash scripts/watch-github-run.sh "$RUN_ID"
        fi
      else
        SHA=$(git rev-parse HEAD)
        REMOTE_MAIN=$(git ls-remote github refs/heads/main | awk '{print $1}')
        SINCE=""
        if [ "$REMOTE_MAIN" != "$SHA" ]; then
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        fi
        git push github HEAD:refs/heads/main
        RUN_ID=$(bash scripts/watch-github-run.sh find --sha "$SHA" --event push --branch main ${SINCE:+--since "$SINCE"} || true)
        if [ -z "$RUN_ID" ]; then
          echo "No GitHub run found for pushed commit $SHA" >&2
          exit 1
        fi
        bash scripts/watch-github-run.sh "$RUN_ID"
      fi

github-dispatch:
  tags: [linux-truenas]
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - bash scripts/trigger-github-build.sh main true false

github-mr-build:
  tags: [linux-truenas]
  stage: sync
  <<: *github-common
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - sh scripts/setup-ssh-key.sh GITHUB_SSH_PRIVATE_KEY github.com
  script:
    - bash scripts/trigger-github-build.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" true false "$CI_COMMIT_SHA"

auto-release:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: auto-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [github-sync]
  variables:
    COCOGITTO_VERSION: "7.0.0"
  before_script:
    - apk add --no-cache bash curl git
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - bash scripts/auto-release.sh

github-release-sync:
  stage: release
  tags: [linux-truenas]
  image: alpine:3.19
  resource_group: release-sync
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - apk add --no-cache python3
    - bash scripts/install-glab.sh
    - sh scripts/setup-ssh-key.sh GITLAB_RELEASE_SSH_KEY gitlab.com
  script:
    - bash scripts/sync-from-github.sh

pages:
  stage: deploy
  tags: [linux-truenas]
  image: $FLUTTER_IMAGE
  resource_group: pages
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: [github-sync]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl unzip xz-utils python3 ca-certificates
    - git clone --depth 1 -b 3.47.7 https://github.com/flutter/flutter.git /opt/flutter
    - export PATH="/opt/flutter/bin:$PATH"
    - git config --global --add safe.directory /opt/flutter
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - flutter --version
    - mkdir -p landing/assets/screenshots
    - cp test/goldens/app_shell.png landing/assets/screenshots/app_shell.png
    - cp test/goldens/watch_page.png landing/assets/screenshots/watch_page.png
    - cp test/goldens/home_page.png landing/assets/screenshots/home_page.png
  script:
    - cd landing && flutter pub get && flutter build web --release --base-href "/" && cd ..
    - flutter pub get && flutter build web --release --base-href "/app/" --output web-app
    - mkdir -p public public/app
    - cp -r landing/build/web/* public/
    - cp -r web-app/* public/app/
    - |
      # Keep the flatpak repo on Pages. On tag pipelines the tag's GitHub
      # release is guaranteed to exist by now (github-sync watched it build);
      # on main pipelines we reuse the latest GitLab release instead.
      URL=""
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        URL=$(curl -fs "https://api.github.com/repos/justacalico/newtube/releases/tags/$CI_COMMIT_TAG" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(next((a["browser_download_url"] for a in r.get("assets",[]) if "flatpak" in a.get("name","")), ""))' || true)
      else
        TAG=$(curl -fs "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases?per_page=1" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["tag_name"] if r else "")' || true)
        if [ -n "$TAG" ]; then
          URL=$(curl -fs "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases/$TAG" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(next((l["url"] for l in r.get("assets",{}).get("links",[]) if "flatpak" in l.get("name","")), ""))' || true)
        fi
      fi
      if [ -n "$URL" ]; then
        mkdir -p public/flatpak
        curl -fsSL "$URL" -o /tmp/flatpak.tar.gz && tar -xzf /tmp/flatpak.tar.gz -C public/flatpak || true
      fi
      mkdir -p public/flatpak
      if [ ! -f public/flatpak/index.html ]; then
        printf '%s\n' '<!doctype html><meta charset="utf-8"><title>NewTube flatpak repo</title><p>Flatpak repository for NewTube. Add it with <code>flatpak remote-add newtube https://httpanimations.gitlab.io/newtube/flatpak</code> once a release is published.</p>' > public/flatpak/index.html
      fi
    - ls public public/app
  artifacts:
    paths:
      - public
