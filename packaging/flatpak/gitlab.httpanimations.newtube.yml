app-id: gitlab.httpanimations.newtube
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: newtube
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
modules:
  - name: newtube
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/newtube /app/bin
      - cp -r bundle/. /app/lib/newtube/
      - install -Dm755 packaging/flatpak/newtube.sh /app/bin/newtube
      - install -Dm644 packaging/linux/newtube.desktop /app/share/applications/gitlab.httpanimations.newtube.desktop
      - install -Dm644 packaging/linux/newtube.png /app/share/icons/hicolor/256x256/apps/gitlab.httpanimations.newtube.png
      - install -Dm644 packaging/linux/gitlab.httpanimations.newtube.metainfo.xml /app/share/metainfo/gitlab.httpanimations.newtube.metainfo.xml
    sources:
      - type: dir
        path: ../..
