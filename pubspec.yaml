name: newtube
description: "A privacy-friendly YouTube client."
publish_to: 'none'
version: 0.15.1+19

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  http: ^1.6.0
  intl: ^0.20.3
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1
  window_manager: ^0.5.2
  youtube_explode_dart: ^3.1.0
  archive: ^4.5.1
  xml: ^6.6.1
  local_notifier: ^0.1.6
  flutter_local_notifications: ^22.3.2
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/icon_256.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#C02026"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#C02026"
    theme_color: "#C02026"
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon.png
